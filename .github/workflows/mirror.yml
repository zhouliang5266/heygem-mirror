name: mirror-image
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Docker Hub image (name:tag)'
        required: true
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc /usr/local/.ghc /usr/local/share/boost /usr/lib/jvm /usr/share/swift /usr/share/miniconda
          df -h /
      - name: Pull image
        run: docker pull "${{ github.event.inputs.image }}"
      - name: Save gzip split
        run: |
          SAFE=$(echo "${{ github.event.inputs.image }}" | tr '/:' '__')
          docker save "${{ github.event.inputs.image }}" | gzip | split -b 1900m - "/tmp/${SAFE}.gz.part-"
          ls -lh /tmp/ | head -20
          echo "SAFE=$SAFE" >> $GITHUB_ENV
      - name: Upload release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="mirror-${SAFE}"
          set -x
          df -h /
          gh release create "$TAG" --title "mirror $SAFE" --notes "source: ${{ github.event.inputs.image }}" || echo "create: 已存在或跳过"
          OK=0
          for i in 1 2 3 4 5; do
            gh release upload "$TAG" /tmp/${SAFE}.gz.part-* --clobber && OK=1 && break
            echo "upload 重试 $i"; sleep 15
          done
          [ "$OK" = "1" ] || { echo "upload 最终失败"; exit 1; }
          gh release view "$TAG" --json assets --jq '.assets[].name'
